<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vulcan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- ============ LOADING SPLASH ============ -->
  <div id="splash" class="splash">
    <div class="splash-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7h11a6 6 0 0 0 5 3l2-2v4.2A5.8 5.8 0 0 1 15.2 18H12l1.4 3H6.6L8 18H7a4 4 0 0 1-4-4V7Z" fill="currentColor"/><rect x="6" y="21" width="12" height="2" rx="1" fill="currentColor"/></svg></span><div class="splash-mark">Vulcan</div></div>
    <div class="spinner"></div>
  </div>

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7h11a6 6 0 0 0 5 3l2-2v4.2A5.8 5.8 0 0 1 15.2 18H12l1.4 3H6.6L8 18H7a4 4 0 0 1-4-4V7Z" fill="currentColor"/><rect x="6" y="21" width="12" height="2" rx="1" fill="currentColor"/></svg></span>
        <span class="brand-name">Vulcan</span>
      </div>
      <h1>Agent time tracking</h1>
      <p class="login-sub">Clock in, log what you're working on, and keep an accurate record of your shift.</p>
      <button id="google-signin-btn" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35.5 24 35.5c-6.3 0-11.5-5.2-11.5-11.5S17.7 12.5 24 12.5c2.9 0 5.5 1.1 7.5 2.9l5.7-5.7C33.6 6.5 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c11 0 19.5-8 19.5-19.5 0-1.2-.1-2.3-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12.5 24 12.5c2.9 0 5.5 1.1 7.5 2.9l5.7-5.7C33.6 6.5 29.1 4.5 24 4.5 16.3 4.5 9.7 8.9 6.3 14.7z"/><path fill="#4CAF50" d="M24 43.5c5.2 0 9.6-2 13-5.2l-6-5.1c-2 1.4-4.5 2.3-7 2.3-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.6 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.2l6 5.1c-.4.4 6.7-4.9 6.7-14.3 0-1.2-.1-2.3-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <p class="login-note">Use your work Google account. New accounts start as agents.</p>
    </div>
    <footer class="login-footer">Vulcan · internal tool · <span class="app-version">v4.1.1</span></footer>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7h11a6 6 0 0 0 5 3l2-2v4.2A5.8 5.8 0 0 1 15.2 18H12l1.4 3H6.6L8 18H7a4 4 0 0 1-4-4V7Z" fill="currentColor"/><rect x="6" y="21" width="12" height="2" rx="1" fill="currentColor"/></svg></span>
        <span class="brand-name">Vulcan</span>
      </div>
      <nav id="nav" class="nav"><!-- nav items injected by role --></nav>
      <div class="sidebar-user">
        <img id="side-avatar" class="avatar" alt="" />
        <div class="sidebar-user-meta">
          <span id="side-name" class="side-name"></span>
          <span id="side-role" class="side-role"></span>
        </div>
        <button id="signout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 id="view-title" class="view-title">Dashboard</h2>
        <button id="preview-exit" class="btn btn-outline btn-sm preview-exit hidden">Exit preview</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle night mode" aria-label="Toggle night mode">🌙</button>
        <button id="bell-btn" class="icon-btn bell-btn hidden" title="IT notifications" aria-label="IT notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="bell-count" class="bell-count hidden">0</span>
        </button>
        <div class="topbar-clock" id="topbar-clock"></div>
      </header>
      <div id="view" class="view"><!-- active view injected here --></div>
      <footer class="app-footer"><span class="app-version">v4.1.1</span></footer>
    </main>

    <div id="scrim" class="scrim"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="assets/js/app.js?v=40"></script>
</body>
</html>

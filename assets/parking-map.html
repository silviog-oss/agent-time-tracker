<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Parking Map</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%2316181D%22/%3E%3Cpath%20d%3D%22M5%2015h14M5%2015a2%202%200%200%201-2-2v-2l2-4h14l2%204v2a2%202%200%200%201-2%202%22%20stroke%3D%22%23FF6A00%22%20stroke-width%3D%221.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%227.5%22%20cy%3D%2215%22%20r%3D%221.6%22%20fill%3D%22%23FF6A00%22/%3E%3Ccircle%20cx%3D%2216.5%22%20cy%3D%2215%22%20r%3D%221.6%22%20fill%3D%22%23FF6A00%22/%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  :root{
    --floor:#E9ECF1; --floor-line:#DFE3E9;
    --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#EEF0F4;
    --ink:#14161A; --ink-2:#5B6470; --ink-3:#98A0AC;
    --line:#E6E8EC; --line-2:#D9DCE2;
    --brand:#FF6A00; --brand-dark:#E85F00; --brand-ink:#B84E00; --brand-wash:#FFF1E8;
    --ok:#16A34A; --warn:#E0A800; --danger:#E5484D;
    --r-lg:14px; --r:10px; --r-sm:8px; --r-xs:6px;
    --sh-1:0 1px 2px rgba(16,22,34,.06);
    --sh-2:0 2px 10px rgba(16,22,34,.09);
    --sh-3:0 10px 30px rgba(16,22,34,.13);
    --sh-4:0 24px 60px rgba(16,22,34,.26);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html.dark{
    --floor:#0F1115; --floor-line:#232730;
    --surface:#1C1F26; --surface-2:#161920; --surface-3:#20242C;
    --ink:#E7E9EC; --ink-2:#9AA3AE; --ink-3:#6B7280;
    --line:#2B2F38; --line-2:#383D48;
    --brand:#FF7A1A; --brand-dark:#FF8C3D; --brand-ink:#FFB37A; --brand-wash:#3A2416;
    --ok:#3ECF6E; --warn:#F5B93F; --danger:#F26B6B;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.4);
    --sh-3:0 10px 30px rgba(0,0,0,.5); --sh-4:0 24px 60px rgba(0,0,0,.6);
  }
  html.dark body{background:var(--surface-2);}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--surface-2);color:var(--ink);-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;}
  button{transition:filter .12s ease, transform .06s ease, box-shadow .14s ease, background .14s ease;}
  button:not(:disabled):hover{filter:brightness(.97);}
  button:not(:disabled):active{transform:translateY(.5px);}
  :where(input,select,textarea):focus{outline:none;box-shadow:0 0 0 3px var(--brand-wash);border-color:var(--brand)!important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#D2D6DD;border-radius:8px;border:2px solid transparent;background-clip:content-box;}

  .spot{transition:box-shadow .14s ease;}
  .spot--sel{box-shadow:0 0 0 2px var(--brand), var(--sh-2)!important;z-index:5;}
  .spot--match{box-shadow:0 0 0 2px var(--warn), 0 0 0 6px rgba(224,168,0,.20)!important;z-index:4;}

  .modal-in{animation:pop .16s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .toast-in{animation:drop .18s ease;}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
  (function(){
    function apply(){ document.documentElement.classList.toggle("dark", localStorage.getItem("vulcan_theme")==="dark"); }
    apply();
    window.addEventListener("storage", (e)=>{ if(e.key==="vulcan_theme") apply(); });
  })();
</script>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { firebaseConfig } from "./js/config.js";
  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const ref = doc(db, "settings", "parking_map");
  let resolveAuth;
  const authReady = new Promise((r) => { resolveAuth = r; });
  onAuthStateChanged(auth, (u) => resolveAuth(u));
  window.ParkingMap = {
    authReady,
    subscribe(cb) {
      return onSnapshot(ref, (snap) => cb(snap.exists() ? snap.data() : null),
        (err) => console.warn("parking sync error:", err.message));
    },
    async save(payload) { await setDoc(ref, { ...payload, updated_at: Date.now() }, { merge: true }); return true; },
  };
</script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const FLOORS = [
  { id: "f1", name: "Floor 1" },
  { id: "f2", name: "Floor 2" },
  { id: "outdoor", name: "Outdoor" },
];
const emptyFloor = () => ({ spots: [] });
const defaultData = () => ({ floors: { f1: emptyFloor(), f2: emptyFloor(), outdoor: emptyFloor() } });

const btn = (bg, text, extra = {}) => ({ background: bg, color: text, border: "none", borderRadius: "var(--r-sm)", padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", boxShadow: "var(--sh-1)", lineHeight: 1, letterSpacing: "-.1px", ...extra });
const ghost = (extra = {}) => ({ background: "var(--surface)", color: "var(--ink-2)", border: "1px solid var(--line)", borderRadius: "var(--r-sm)", padding: "8px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", boxShadow: "none", lineHeight: 1, ...extra });
const iStyle = { width: "100%", padding: "9px 11px", borderRadius: "var(--r-sm)", border: "1px solid var(--line-2)", fontSize: 13, boxSizing: "border-box", background: "var(--surface)", color: "var(--ink)" };
const lStyle = { fontSize: 10, fontWeight: 700, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 4 };

function matches(s, q) {
  if (!q) return false;
  const t = q.toLowerCase();
  return ["label", "name", "email", "phone", "plate", "notes"].some((k) => (s[k] || "").toLowerCase().includes(t));
}

function App() {
  const canEdit = (() => { try { const v = new URLSearchParams(location.search).get("edit"); return v === null ? true : v === "1"; } catch { return true; } })();

  const [data, setData] = useState(defaultData());
  const [activeFloor, setActiveFloor] = useState("f1");
  const [selectedId, setSelectedId] = useState(null);
  const [form, setForm] = useState(null);
  const [search, setSearch] = useState("");
  const [zoom, setZoom] = useState(1);
  const [hasUnsaved, setHasUnsaved] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [toast, setToast] = useState("");
  const [toastType, setToastType] = useState("info");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const canvasRef = useRef(null);
  const dragRef = useRef(null); // {id, startX, startY, origX, origY}
  const hasUnsavedRef = useRef(false);
  useEffect(() => { hasUnsavedRef.current = hasUnsaved; }, [hasUnsaved]);

  useEffect(() => {
    if (!window.ParkingMap) return;
    let unsub = () => {};
    window.ParkingMap.authReady.then(() => {
      unsub = window.ParkingMap.subscribe((doc) => {
        if (!doc || !doc.floors) { window.ParkingMap.save(defaultData()).catch(() => {}); return; }
        if (hasUnsavedRef.current) return;
        setData(doc);
        setSavedAt(doc.updated_at || Date.now());
        setHasUnsaved(false);
      });
    });
    return () => { try { unsub(); } catch {} };
  }, []);

  function showToast(msg, type = "info") { setToast(msg); setToastType(type); setTimeout(() => setToast(""), 2400); }
  const toastBg = { success: "var(--ok)", error: "var(--danger)", info: "#1B1F26" };

  const spots = (data.floors[activeFloor] || emptyFloor()).spots;
  function updateSpots(next) {
    setData((d) => ({ ...d, floors: { ...d.floors, [activeFloor]: { spots: next } } }));
    setHasUnsaved(true);
  }

  function saveMap() {
    if (!window.ParkingMap) { showToast("Offline — can't save", "error"); return; }
    window.ParkingMap.save(data)
      .then(() => { setSavedAt(Date.now()); setHasUnsaved(false); showToast("Saved for everyone", "success"); })
      .catch(() => showToast("Save failed", "error"));
  }

  function selectSpot(s) {
    setSelectedId(s.id);
    setForm({ ...s });
  }
  function deselect() { setSelectedId(null); setForm(null); }

  function addSpotAt(x, y) {
    if (!canEdit) return;
    const id = Date.now();
    const s = { id, x: Math.round(x - 35), y: Math.round(y - 65), w: 70, h: 130, rot: 0, label: "", name: "", email: "", phone: "", plate: "", notes: "" };
    updateSpots([...spots, s]);
    selectSpot(s);
  }
  function handleCanvasClick(e) {
    if (!canEdit) return;
    if (e.target !== canvasRef.current) return; // ignore clicks on spots themselves
    const rect = canvasRef.current.getBoundingClientRect();
    const x = (e.clientX - rect.left) / zoom;
    const y = (e.clientY - rect.top) / zoom;
    addSpotAt(x, y);
  }

  function startDrag(e, s) {
    if (!canEdit) return;
    e.stopPropagation();
    dragRef.current = { id: s.id, startX: e.clientX, startY: e.clientY, origX: s.x, origY: s.y, moved: false };
    selectSpot(s);
  }
  useEffect(() => {
    function onMove(e) {
      if (!dragRef.current) return;
      const d = dragRef.current;
      const dx = (e.clientX - d.startX) / zoom;
      const dy = (e.clientY - d.startY) / zoom;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) d.moved = true;
      if (!d.moved) return;
      updateSpots(spots.map((s) => s.id === d.id ? { ...s, x: Math.round(d.origX + dx), y: Math.round(d.origY + dy) } : s));
    }
    function onUp() { dragRef.current = null; }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [spots, zoom, activeFloor]);

  function saveForm() {
    if (!form) return;
    updateSpots(spots.map((s) => s.id === form.id ? { ...form } : s));
    selectSpot(form);
    showToast("Spot updated");
  }
  function deleteSpot(id) {
    updateSpots(spots.filter((s) => s.id !== id));
    deselect();
    setConfirmDelete(null);
    showToast("Spot removed");
  }
  function rotateBy(delta) {
    if (!form) return;
    const next = { ...form, rot: ((form.rot || 0) + delta + 360) % 360 };
    setForm(next);
  }

  const q = search.trim();
  const matchIds = q ? new Set(spots.filter((s) => matches(s, q)).map((s) => s.id)) : new Set();

  return (
    <div style={{ minHeight: "100%", padding: "20px 16px 40px", width: "100%", boxSizing: "border-box" }}>
      <div style={{ maxWidth: 1600, margin: "0 auto", width: "100%" }}>

        {toast && <div className="toast-in" style={{ position: "fixed", top: 18, left: "50%", transform: "translateX(-50%)", background: toastBg[toastType] || "#1B1F26", color: "#fff", padding: "11px 20px", borderRadius: "var(--r)", fontSize: 13, fontWeight: 600, zIndex: 9999, boxShadow: "var(--sh-3)", pointerEvents: "none" }}>{toast}</div>}

        {confirmDelete && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(11,15,22,0.42)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9998 }}>
            <div className="modal-in" style={{ background: "var(--surface)", borderRadius: "var(--r-lg)", padding: 24, width: 300, textAlign: "center", boxShadow: "var(--sh-4)" }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Remove this spot?</div>
              <div style={{ fontSize: 12.5, color: "var(--ink-2)", marginBottom: 16 }}>{confirmDelete.label || "This spot"} will be deleted.</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setConfirmDelete(null)} style={{ ...ghost(), flex: 1, padding: "9px 0" }}>Cancel</button>
                <button onClick={() => deleteSpot(confirmDelete.id)} style={{ ...btn("var(--danger)", "#fff"), flex: 1, padding: "9px 0" }}>Delete</button>
              </div>
            </div>
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
          <div>
            <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-.5px", color: "var(--ink)" }}>Parking</h1>
            <p style={{ marginTop: 4, fontSize: 12.5, color: "var(--ink-2)" }}>{canEdit ? "Click an open spot to add one · drag to move" : "View only"} · {spots.length} spot{spots.length !== 1 ? "s" : ""}</p>
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
            <div style={{ position: "relative" }}>
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search name, email, phone, plate…" style={{ padding: "8px 12px", borderRadius: 999, border: `1.5px solid ${search ? "var(--brand)" : "var(--line-2)"}`, fontSize: 12.5, width: 230, outline: "none", background: "var(--surface)" }} />
            </div>
            {canEdit
              ? <button onClick={saveMap} style={{ ...btn(hasUnsaved ? "var(--ok)" : "var(--surface)", hasUnsaved ? "#fff" : "var(--ink-3)"), border: hasUnsaved ? "none" : "1px solid var(--line)", minWidth: 80 }}>{hasUnsaved ? "Save" : "Saved"}</button>
              : <span style={{ fontSize: 12, color: "var(--ink-3)", fontWeight: 600, padding: "8px 4px" }}>View only</span>
            }
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "center", flexWrap: "wrap", justifyContent: "space-between" }}>
          <div style={{ display: "flex", gap: 3, background: "var(--surface-2)", border: "1px solid var(--line)", borderRadius: "var(--r-sm)", padding: 3 }}>
            {FLOORS.map((f) => (
              <button key={f.id} onClick={() => { setActiveFloor(f.id); deselect(); }}
                style={{ padding: "8px 16px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", borderRadius: 6, border: "none",
                  background: activeFloor === f.id ? "var(--surface)" : "transparent", color: activeFloor === f.id ? "var(--ink)" : "var(--ink-2)",
                  boxShadow: activeFloor === f.id ? "var(--sh-1)" : "none" }}>{f.name}</button>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 5, background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--r-sm)", padding: "4px 8px", boxShadow: "var(--sh-1)" }}>
            <span style={{ fontSize: 11, color: "var(--ink-3)", fontWeight: 600 }}>Zoom</span>
            <button onClick={() => setZoom((z) => Math.max(0.5, Math.round((z - 0.1) * 10) / 10))} style={{ background: "var(--surface-2)", border: "1px solid var(--line)", borderRadius: 6, width: 22, height: 22, cursor: "pointer" }}>−</button>
            <span style={{ fontSize: 12, fontWeight: 700, minWidth: 38, textAlign: "center", fontFamily: "var(--mono)" }}>{Math.round(zoom * 100)}%</span>
            <button onClick={() => setZoom((z) => Math.min(2, Math.round((z + 0.1) * 10) / 10))} style={{ background: "var(--surface-2)", border: "1px solid var(--line)", borderRadius: 6, width: 22, height: 22, cursor: "pointer" }}>+</button>
          </div>
        </div>

        <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 12 }}>
          {savedAt ? <span>{hasUnsaved ? "● Unsaved · " : "✓ "}Last saved <span style={{ fontFamily: "var(--mono)" }}>{new Date(savedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span></span> : <span>{hasUnsaved ? "● Unsaved changes — click Save" : "No save yet"}</span>}
        </div>

        <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ background: "var(--surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--line)", boxShadow: "var(--sh-1)", padding: 16, flex: "1 1 700px", minWidth: 0, overflow: "auto" }}>
            <div style={{ transform: `scale(${zoom})`, transformOrigin: "top left" }}>
              <div ref={canvasRef} onClick={handleCanvasClick}
                style={{ position: "relative", width: 1400, height: 820, borderRadius: "var(--r)",
                  cursor: canEdit ? "crosshair" : "default",
                  background: activeFloor === "outdoor" ? "repeating-linear-gradient(90deg, #DADFE6, #DADFE6 2px, var(--floor) 2px, var(--floor) 90px)" : "var(--floor)",
                  border: "1px solid var(--floor-line)" }}>
                {spots.map((s) => {
                  const isSel = selectedId === s.id;
                  const isMatch = matchIds.has(s.id);
                  return (
                    <div key={s.id} className={`spot${isSel ? " spot--sel" : ""}${isMatch ? " spot--match" : ""}`}
                      onMouseDown={(e) => startDrag(e, s)}
                      onClick={(e) => { e.stopPropagation(); if (!dragRef.current || !dragRef.current.moved) selectSpot(s); }}
                      style={{ position: "absolute", left: s.x, top: s.y, width: s.w, height: s.h,
                        transform: `rotate(${s.rot || 0}deg)`,
                        background: s.name ? "var(--brand-wash)" : "var(--surface)",
                        border: `2px solid ${s.name ? "var(--brand)" : "var(--line-2)"}`,
                        borderStyle: s.name ? "solid" : "dashed",
                        borderRadius: 6, cursor: canEdit ? "grab" : "pointer",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                        padding: 4, textAlign: "center", userSelect: "none", overflow: "hidden" }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "var(--ink)" }}>{s.label || "—"}</div>
                      {s.name && <div style={{ fontSize: 9.5, color: "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "100%" }}>{s.name}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div style={{ width: 290, flexShrink: 0 }}>
            {!form && (
              <div style={{ background: "var(--surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--line)", boxShadow: "var(--sh-1)", padding: "28px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 13.5, color: "var(--ink-2)", fontWeight: 600 }}>Select a spot to manage it</div>
                <div style={{ fontSize: 12, marginTop: 6, color: "var(--ink-3)" }}>{canEdit ? "Click an open area on the lot to add a new spot." : "Search by name, email, phone, or plate."}</div>
              </div>
            )}
            {form && (
              <div style={{ background: "var(--surface)", borderRadius: "var(--r-lg)", border: "1px solid var(--line)", boxShadow: "var(--sh-1)", padding: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div style={{ fontSize: 15.5, fontWeight: 700 }}>{form.label || "Spot"}</div>
                  <button onClick={deselect} style={{ background: "none", border: "none", fontSize: 19, cursor: "pointer", color: "var(--ink-3)" }}>×</button>
                </div>
                <div style={{ marginBottom: 11 }}><div style={lStyle}>Spot label / number</div>
                  <input value={form.label} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, label: e.target.value }))} placeholder="e.g. A12" style={iStyle} />
                </div>
                <div style={{ marginBottom: 11 }}><div style={lStyle}>Assigned to</div>
                  <input value={form.name} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="Name" style={iStyle} />
                </div>
                <div style={{ marginBottom: 11 }}><div style={lStyle}>Email</div>
                  <input type="email" value={form.email} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, email: e.target.value }))} placeholder="name@company.com" style={iStyle} />
                </div>
                <div style={{ marginBottom: 11 }}><div style={lStyle}>Phone</div>
                  <input type="tel" value={form.phone} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, phone: e.target.value }))} placeholder="+1 555 123 4567" style={iStyle} />
                </div>
                <div style={{ marginBottom: 11 }}><div style={lStyle}>License plate</div>
                  <input value={form.plate} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, plate: e.target.value }))} placeholder="ABC-1234" style={iStyle} />
                </div>
                {canEdit && (
                  <>
                    <div style={{ display: "flex", gap: 8, marginBottom: 11 }}>
                      <div style={{ flex: 1 }}><div style={lStyle}>Width</div><input type="number" value={form.w} onChange={(e) => setForm((f) => ({ ...f, w: parseInt(e.target.value, 10) || f.w }))} style={iStyle} /></div>
                      <div style={{ flex: 1 }}><div style={lStyle}>Height</div><input type="number" value={form.h} onChange={(e) => setForm((f) => ({ ...f, h: parseInt(e.target.value, 10) || f.h }))} style={iStyle} /></div>
                    </div>
                    <div style={{ marginBottom: 14 }}><div style={lStyle}>Angle (for angled rows)</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <button onClick={() => rotateBy(-15)} style={{ ...ghost(), padding: "7px 11px" }}>↺ 15°</button>
                        <span style={{ fontSize: 13, fontWeight: 700, fontFamily: "var(--mono)", flex: 1, textAlign: "center" }}>{form.rot || 0}°</span>
                        <button onClick={() => rotateBy(15)} style={{ ...ghost(), padding: "7px 11px" }}>↻ 15°</button>
                      </div>
                    </div>
                  </>
                )}
                <div style={{ marginBottom: 14 }}><div style={lStyle}>Notes</div>
                  <textarea value={form.notes} disabled={!canEdit} onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))} rows={2} placeholder="Any notes…" style={{ ...iStyle, resize: "vertical" }} />
                </div>
                {canEdit && (
                  <>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={deselect} style={{ ...ghost(), flex: 1, padding: "9px 0" }}>Cancel</button>
                      <button onClick={saveForm} style={{ ...btn("var(--ok)", "#fff"), flex: 1, padding: "9px 0" }}>Save spot</button>
                    </div>
                    <button onClick={() => setConfirmDelete(form)} style={{ ...btn("var(--surface)", "var(--danger)"), border: "1px solid #F6C9CB", boxShadow: "none", width: "100%", marginTop: 8, padding: "9px 0" }}>Remove this spot</button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, getDocs, deleteDoc, collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { firebaseConfig } from "./js/config.js";
  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const ref = doc(db, "settings", "office_map");
  let resolveAuth;
  const authReady = new Promise((r) => { resolveAuth = r; });
  onAuthStateChanged(auth, (u) => resolveAuth(u));
  // Shared, everyone-can-edit map stored in one Firestore doc.
  const invCol = collection(db, "inventory");
  const histCol = collection(db, "map_history");
  const norm = (n) => (n || "").trim().toLowerCase();
  window.ShiftMap = {
    authReady,
    subscribe(cb) {
      return onSnapshot(ref, (snap) => cb(snap.exists() ? snap.data() : null),
        (err) => console.warn("map sync error:", err.message));
    },
    async save(payload) {
      // Snapshot the PREVIOUS live state to history before overwriting it,
      // so there's always a "how it was before this save" checkpoint.
      const whoName = (auth.currentUser && (auth.currentUser.displayName || auth.currentUser.email)) || "Unknown";
      try {
        const prevDoc = await getDoc(ref);
        if (prevDoc.exists()) {
          const prev = prevDoc.data();
          if (prev && prev.state) {
            await addDoc(histCol, {
              state: prev.state, nextId: prev.nextId || 100,
              saved_at: prev.updated_at || Date.now(),
              saved_by_name: whoName,
            });
          }
        }
      } catch (e) { console.warn("history snapshot failed:", e.message); }
      await setDoc(ref, { ...payload, updated_at: Date.now() });
      // Keep only the most recent 20 snapshots.
      try {
        const old = await getDocs(query(histCol, orderBy("saved_at", "desc"), limit(50)));
        const docs = old.docs;
        if (docs.length > 20) await Promise.all(docs.slice(20).map((d) => deleteDoc(d.ref)));
      } catch (e) { console.warn("history trim failed:", e.message); }
      return true;
    },
    async listHistory() {
      const snap = await getDocs(query(histCol, orderBy("saved_at", "desc"), limit(20)));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },

    // ---- Inventory: the single source of truth for workstations ----
    subscribeInventory(cb) {
      return onSnapshot(invCol, (snap) => {
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        cb(list);
      }, (err) => console.warn("inventory sync error:", err.message));
    },
    // Reconcile ALL of a person's devices with the inventory collection.
    // Devices removed from the person are NOT deleted — they become Unassigned.
    async syncPersonDevices(personName, devices) {
      if (!personName) return false;
      const all = [];
      (await getDocs(invCol)).forEach((d) => all.push({ id: d.id, ...d.data() }));
      const mine = all.filter((i) => norm(i.assigned_to) === norm(personName));
      const byCat = {};
      (devices || []).forEach((d) => {
        const c = d.type || "Extras";
        (byCat[c] = byCat[c] || []).push(d);
      });
      const cats = new Set([...Object.keys(byCat), ...mine.map((i) => i.category || "Extras")]);
      for (const cat of cats) {
        const want = (byCat[cat] || []).filter((d) => (d.model || d.sn || d.tag));
        const have = mine.filter((i) => (i.category || "Extras") === cat);
        for (let k = 0; k < Math.max(want.length, have.length); k++) {
          const w = want[k], h = have[k];
          if (w && h) {
            await updateDoc(doc(invCol, h.id), {
              assigned_to: personName, category: cat,
              model: w.model || "", serial: w.sn || "", tag: w.tag || "",
              status: "Assigned", updated_at: Date.now(),
            });
          } else if (w && !h) {
            await addDoc(invCol, {
              assigned_to: personName, category: cat,
              model: w.model || "", serial: w.sn || "", tag: w.tag || "",
              status: "Assigned", since: "", notes: "", created_at: Date.now(), updated_at: Date.now(),
            });
          } else if (!w && h) {
            // removed from this person -> return to the unassigned pool
            await updateDoc(doc(invCol, h.id), {
              assigned_to: "", status: "Unassigned",
              released_from: personName, updated_at: Date.now(),
            });
          }
        }
      }
      return true;
    },
  };
</script>

const btn=(bg,text,extra={})=>({background:bg,color:text,border:"none",borderRadius:"var(--r-sm)",padding:"8px 14px",fontSize:12.5,fontWeight:600,cursor:"pointer",boxShadow:"var(--sh-1)",lineHeight:1,letterSpacing:"-.1px",...extra});
const ghost=(extra={})=>({background:"var(--surface)",color:"var(--ink-2)",border:"1px solid var(--line)",borderRadius:"var(--r-sm)",padding:"8px 12px",fontSize:12.5,fontWeight:600,cursor:"pointer",boxShadow:"none",lineHeight:1,...extra});
const iStyle={width:"100%",padding:"9px 11px",borderRadius:"var(--r-sm)",border:"1px solid var(--line-2)",fontSize:13,boxSizing:"border-box",background:"var(--surface)",color:"var(--ink)",transition:"box-shadow .12s ease, border-color .12s ease"};

function matches(c,q){
  if(!q)return false;
  const s=q.toLowerCase();
  if(c.name.toLowerCase().includes(s))return true;
  if((c.role||"").toLowerCase().includes(s))return true;
  if((c.notes||"").toLowerCase().includes(s))return true;
  for(const d of(c.devices||[])){
    if((d.type||"").toLowerCase().includes(s))return true;
    if((d.model||"").toLowerCase().includes(s))return true;
    if((d.sn||"").toLowerCase().includes(s))return true;
    if((d.tag||"").toLowerCase().includes(s))return true;
  }
  return false;
}

function App(){
  const [history,setHistory]=useState([defaultState]);
  const [histPtr,setHistPtr]=useState(0);
  const [nextId,setNextId]=useState(100);
  const [savedAt,setSavedAt]=useState(null);
  const [hasUnsaved,setHasUnsaved]=useState(false);
  const hasUnsavedRef=useRef(false);
  useEffect(()=>{hasUnsavedRef.current=hasUnsaved;},[hasUnsaved]);
  const [selected,setSelected]=useState(null);
  const [panel,setPanel]=useState("view");
  const [search,setSearch]=useState(()=>{try{return new URLSearchParams(location.search).get("highlight")||"";}catch{return "";}});
  const [dragging,setDragging]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [toast,setToast]=useState("");
  const [toastType,setToastType]=useState("info");
  const [addForm,setAddForm]=useState({name:"",role:"",row:"",col:""});
  const [devicesForm,setDevicesForm]=useState(null);
  const [expandedDevices,setExpandedDevices]=useState({});
  const [personForm,setPersonForm]=useState(null);
  const [showWFH,setShowWFH]=useState(false);
  const [wfhForm,setWfhForm]=useState({name:"",role:""});
  const [wfhSelected,setWfhSelected]=useState(null);
  const [wfhPanel,setWfhPanel]=useState("view");
  const [wfhDevicesForm,setWfhDevicesForm]=useState(null);
  const [wfhExpandedDevices,setWfhExpandedDevices]=useState({});
  const [returnCoords,setReturnCoords]=useState({});
  const [pendingCell,setPendingCell]=useState(null);
  const [showHistory,setShowHistory]=useState(false);
  const [historyList,setHistoryList]=useState([]);
  const [historyLoading,setHistoryLoading]=useState(false);
  const [zoom,setZoom]=useState(1);
  const [newRolePrompt,setNewRolePrompt]=useState(null);
  const [newRoleName,setNewRoleName]=useState("");
  const [newRoleColor,setNewRoleColor]=useState("#FF6A00");
  const [roleEditor,setRoleEditor]=useState(null);
  const [pendingRoleColor,setPendingRoleColor]=useState("#FF6A00");
  const dragItem=useRef(null);
  const gridRef=useRef(null);
  const [resizing,setResizing]=useState(null); // {id,startX,startY,startW,startH,cellW,cellH,row,col}
  const [resizePreview,setResizePreview]=useState(null); // {id,w,h} live preview while dragging
  const resizePreviewRef=useRef(null);
  useEffect(()=>{resizePreviewRef.current=resizePreview;},[resizePreview]);

  function startResize(e,cub){
    e.stopPropagation();e.preventDefault();
    const rect=gridRef.current?gridRef.current.getBoundingClientRect():null;
    const cellW=rect?rect.width/COLS:56*zoom;
    const cellH=Math.round(66*zoom);
    setResizing({id:cub.id,startX:e.clientX,startY:e.clientY,startW:cub.w||1,startH:cub.h||1,cellW,cellH,row:cub.row,col:cub.col});
    setResizePreview({id:cub.id,w:cub.w||1,h:cub.h||1});
  }
  useEffect(()=>{
    if(!resizing) return;
    function onMove(e){
      const dCols=Math.round((e.clientX-resizing.startX)/resizing.cellW);
      const dRows=Math.round((e.clientY-resizing.startY)/resizing.cellH);
      let w=Math.max(1,resizing.startW+dCols);
      let h=Math.max(1,resizing.startH+dRows);
      w=Math.min(w,COLS-resizing.col+1);
      h=Math.min(h,ROWS-resizing.row+1);
      // Don't grow into a cell already occupied by something else.
      while(w>1&&cubicles.some(c=>c.id!==resizing.id&&c.row>=resizing.row&&c.row<resizing.row+h&&c.col===resizing.col+w-1)) w--;
      while(h>1&&cubicles.some(c=>c.id!==resizing.id&&c.col>=resizing.col&&c.col<resizing.col+w&&c.row===resizing.row+h-1)) h--;
      setResizePreview({id:resizing.id,w,h});
    }
    function onUp(){
      const preview=resizePreviewRef.current;
      if(preview){
        pushState({cubicles:cubicles.map(c=>c.id===preview.id?{...c,w:preview.w,h:preview.h}:c)});
        showToast(`Resized to ${preview.w}×${preview.h}`);
      }
      setResizing(null);setResizePreview(null);
    }
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    return ()=>{window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);};
  },[resizing]);
  const [inventory,setInventory]=useState([]);

  useEffect(()=>{
    if(!window.ShiftMap||!window.ShiftMap.subscribeInventory) return;
    let un=()=>{};
    window.ShiftMap.authReady.then(()=>{ un=window.ShiftMap.subscribeInventory(setInventory); });
    return ()=>{try{un();}catch{}};
  },[]);

  function pushToInventory(personName, devs){
    if(!window.ShiftMap||!window.ShiftMap.syncPersonDevices) return;
    if(!personName) return;
    window.ShiftMap.syncPersonDevices(personName, devs||[])
      .catch(e=>showToast("Inventory not updated: "+e.message,"error"));
  }

  function invFor(name){
    const n=(name||"").trim().toLowerCase();
    if(!n) return null;
    return inventory.find(i=>(i.assigned_to||"").trim().toLowerCase()===n)||null;
  }

  function pullFromInventory(){
    if(!inventory.length){showToast("Inventory is empty","error");return;}
    let n=0;
    const apply=(list)=>list.map(c=>{
      const recs=inventory.filter(i=>(i.assigned_to||"").trim().toLowerCase()===(c.name||"").trim().toLowerCase());
      if(!recs.length) return c;
      const devs=withStandardSlots([]);
      recs.forEach(r=>{const cat=r.category||"Extras";
        const slot=devs.find(d=>d.type===cat&&!d.model&&!d.sn);
        const item={type:cat,model:r.model||"",sn:r.serial||"",tag:r.tag||""};
        if(slot){Object.assign(slot,item);}else{devs.push(item);}});
      n++;
      return {...c,devices:devs};
    });

  function styleFor(role){

      // Dark mode: mix toward the dark surface instead of white, and keep
      // text light enough to actually read against it.
      return {
        dot:c,
        bg:`color-mix(in srgb, ${c} 22%, #14161A)`,
        text:`color-mix(in srgb, ${c} 55%, white)`,
        border:`color-mix(in srgb, ${c} 40%, #14161A)`,
      };
    }
    if(!roleColors[role]) return base;
    return {
      dot:c,
      bg:`color-mix(in srgb, ${c} 12%, white)`,
      text:`color-mix(in srgb, ${c} 70%, black)`,
      border:`color-mix(in srgb, ${c} 35%, white)`,

  function resizeGrid(dr,dc){
    let next=cubicles, nr=ROWS, nc=COLS;
    // Columns: "+" inserts space on the LEFT (existing desks shift right).
    if(dc>0){
      nc=COLS+dc;
      next=next.map(c=>({...c,col:c.col+dc}));
    } else if(dc<0){
      const remove=Math.min(-dc,COLS-1);
      if(cubicles.some(c=>c.col<=remove)){showToast("Leftmost column has desks — move them first","error");return;}
      nc=Math.max(1,COLS-remove);
      next=next.map(c=>({...c,col:c.col-remove}));
    }
    // Rows: "+" appends space at the BOTTOM — nobody's position changes.
    if(dr>0){
      nr=ROWS+dr;
    } else if(dr<0){
      const remove=Math.min(-dr,ROWS-1);
      const cutoff=ROWS-remove;
      if(cubicles.some(c=>c.row>cutoff)){showToast("Bottom row has desks — move them first","error");return;}
      nr=Math.max(1,ROWS-remove);
    }
    pushState({rows:nr,cols:nc,cubicles:next});
    showToast(`${nr}×${nc}`);
  }

                    title="Click to add"
                    style={{borderRadius:"var(--r-xs)",cursor:"pointer",background:isPending?"var(--brand-wash)":isOver?"var(--brand-wash)":"transparent",border:isPending?"2px solid var(--brand)":isOver?"2px dashed var(--brand)":"1px dashed transparent"}}/>);
                  const cls=`desk${isSel?" desk--sel":""}${isMatch?" desk--match":""}${isOver&&dragging?.id!==cub.id?" desk--over":""}`;
                  return(
                    <div key={key} draggable={!isReserved||!isSel} className={cls} onDragStart={e=>handleDragStart(e,cub)} onDragEnd={handleDragEnd}
                      onDragOver={e=>handleDragOver(e,row,col)} onDrop={e=>handleDrop(e,row,col)} onClick={()=>selectCubicle(cub)}
                      style={{position:"relative",
                        gridColumn:isReserved?`span ${spanW}`:undefined,gridRow:isReserved?`span ${spanH}`:undefined,
                        background:isWall?"repeating-linear-gradient(45deg,#6B7280,#6B7280 6px,#4B5563 6px,#4B5563 12px)":isBlock?"#20262F":isMatch?"#FEF7DC":isOver&&dragging?.id!==cub.id?"var(--brand-wash)":isEmpty?"var(--surface)":s.bg,
                        border:isWall?"1px solid #374151":isBlock?"1px solid #161B22":isEmpty?"1.5px dashed var(--line-2)":`1px solid ${s.border}`,
                        borderRadius:isWall?3:"var(--r)",padding:`${Math.max(4,Math.round(12*Math.min(zoom,1.2)))}px ${Math.max(2,Math.round(6*Math.min(zoom,1.2)))}px ${Math.max(3,Math.round(8*Math.min(zoom,1.2)))}px`,cursor:dragging?"grabbing":"pointer",
                        display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:2,
                        textAlign:"center",opacity:isDraggingThis?0.4:isDimmed?0.28:1,userSelect:"none",overflow:"hidden"}}>
                      {!isReserved&&<div style={{position:"absolute",top:6,left:"50%",transform:"translateX(-50%)",width:26,height:4,borderRadius:3,background:isEmpty?"#DEE2E9":s.dot}}/>}
                      <div style={{position:"absolute",top:5,right:6,fontSize:9,color:isReserved?"#E5E7EB":"#C6CDD7",lineHeight:1}}>⠿</div>
                      {(!isWall||cub.name)&&<div style={{fontSize:Math.max(7,Math.round(11.5*Math.min(zoom,1.2))),fontWeight:700,letterSpacing:"-.15px",color:isBlock?"#AEB6C2":isWall?"#F3F4F6":isEmpty?"var(--ink-3)":"var(--ink)",lineHeight:1.15,fontStyle:isEmpty?"italic":"normal",maxWidth:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isBlock?(cub.name||"Reserved"):isWall?cub.name:isEmpty?"Open desk":cub.name}</div>}
                      {!isReserved&&cub.role&&zoom>=0.7&&<div style={{fontSize:Math.max(6,Math.round(8.5*Math.min(zoom,1.2))),fontWeight:700,letterSpacing:".4px",textTransform:"uppercase",color:s.text}}>{cub.role}</div>}
                      {!isReserved&&cubDevices.length>0&&<div style={{marginTop:2,fontSize:9,fontWeight:600,color:"var(--ink-3)",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:999,padding:"1px 6px"}}>🖥️ {cubDevices.length}</div>}
                      {isReserved&&isSel&&<div onMouseDown={e=>startResize(e,cub)} title="Drag to resize"
                        style={{position:"absolute",bottom:-2,right:-2,width:14,height:14,cursor:"nwse-resize",
                          background:"var(--brand)",border:"2px solid #fff",borderRadius:3,zIndex:5}}/>}
                    </div>
                  );
                }))}
              </div>
            </div>
            <div className="eyebrow" style={{marginTop:10}}>Front of room</div>
            {dragging&&<div style={{textAlign:"center",marginTop:8,fontSize:12,color:"var(--brand-ink)",fontWeight:600}}>Drop to move or swap</div>}
          </div>

          <div style={{width:290,flexShrink:0}}>
            {pendingCell&&!selected&&panel!=="add"&&panel!=="addblack"&&(
              <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",border:"1px solid var(--line)",boxShadow:"var(--sh-1)",padding:18}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:15.5,fontWeight:700}}>Row {pendingCell.row} · Col {pendingCell.col}</div>
                  <button onClick={()=>setPendingCell(null)} style={{background:"none",border:"none",fontSize:19,cursor:"pointer",color:"var(--ink-3)"}}>×</button>
                </div>
                <div style={{fontSize:12.5,color:"var(--ink-2)",marginBottom:14}}>What goes here?</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <button onClick={()=>chooseCellType("person")} style={{...btn("var(--brand)","#fff"),padding:"10px 0"}}>Add person</button>
                  <button onClick={()=>chooseCellType("empty")} style={{...ghost(),padding:"10px 0"}}>Empty seat</button>
                  <button onClick={()=>chooseCellType("block")} style={{...btn("var(--ink)","#fff"),padding:"10px 0"}}>Add block</button>
                  <button onClick={()=>chooseCellType("wall")} style={{...btn("#4B5563","#fff"),padding:"10px 0"}}>Add wall</button>
                  <button onClick={()=>setPendingCell(null)} style={{...ghost(),padding:"10px 0"}}>Cancel</button>
                </div>
              </div>
            )}

            {(panel==="add"||panel==="addblack"||panel==="addempty"||panel==="addwall")&&!selected&&(
              <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",border:"1px solid var(--line)",boxShadow:"var(--sh-1)",padding:18}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{fontSize:15.5,fontWeight:700}}>{panel==="addblack"?"Add block":panel==="addempty"?"Add empty seat":panel==="addwall"?"Add wall":"Add person"}</div>
                  <button onClick={()=>{setPanel("view");setPendingCell(null);}} style={{background:"none",border:"none",fontSize:19,cursor:"pointer",color:"var(--ink-3)"}}>×</button>
                </div>
                {panel==="addblack"&&<div style={{fontSize:12,color:"var(--ink-2)",marginBottom:14,background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"8px 11px",border:"1px solid var(--line)"}}>A reserved or blocked spot. Drag it anywhere after placing.</div>}
                {panel==="addempty"&&<div style={{fontSize:12,color:"var(--ink-2)",marginBottom:14,background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"8px 11px",border:"1px solid var(--line)"}}>A regular desk with nobody assigned yet — shows as "Open desk" on the floor.</div>}
                {panel==="addwall"&&<div style={{fontSize:12,color:"var(--ink-2)",marginBottom:14,background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"8px 11px",border:"1px solid var(--line)"}}>A wall segment. Drag it to mark room edges or aisles — place several to build a longer wall.</div>}
                {(panel==="add"?[["Name","name","text"],[`Row (1–${ROWS})`,"row","number"],[`Col (1–${COLS})`,"col","number"]]:panel==="addempty"?[[`Row (1–${ROWS})`,"row","number"],[`Col (1–${COLS})`,"col","number"]]:[["Label (optional)","name","text"],[`Row (1–${ROWS})`,"row","number"],[`Col (1–${COLS})`,"col","number"]]).map(([lbl,k,type])=>(
                  <div key={k} style={{marginBottom:11}}><div style={lStyle}>{lbl}</div>
                    <input type={type} value={addForm[k]} onChange={e=>setAddForm(f=>({...f,[k]:e.target.value}))} style={iStyle}/>
                  </div>
                ))}
                {panel==="add"&&(<div style={{marginBottom:14}}><div style={lStyle}>Role</div>
                  <select value={addForm.role} onChange={e=>{if(e.target.value==="__new__")requestNewRole("add");else setAddForm(f=>({...f,role:e.target.value}));}} style={iStyle}>
                    {roleOptions.map(r=><option key={r} value={r}>{r}</option>)}
                    <option value="">— No role —</option>
                    <option value="__new__">＋ Add new role…</option>
                  </select></div>
                )}
                <button onClick={panel==="addblack"?addBlock:panel==="addempty"?addEmptySeatFromForm:panel==="addwall"?addWall:addPerson} style={{...btn(panel==="add"?"var(--brand)":panel==="addwall"?"#4B5563":"var(--ink)","#fff"),width:"100%",padding:"10px 0",fontSize:13}}>
                  {panel==="addblack"?"Place block":panel==="addempty"?"Place empty seat":panel==="addwall"?"Place wall":"Add to map"}
                </button>
              </div>
            )}

            {!selected&&!pendingCell&&!["add","addblack","addempty","addwall"].includes(panel)&&(
              <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",border:"1px solid var(--line)",boxShadow:"var(--sh-1)",padding:"28px 20px",textAlign:"center"}}>
                <div style={{fontSize:13.5,color:"var(--ink-2)",fontWeight:600}}>Select a desk to manage it</div>
                <div style={{fontSize:12,marginTop:6,color:"var(--ink-3)"}}>Click an empty spot to add someone, or search by name, role, model, serial, or asset tag.</div>
              </div>
            )}

            {selected&&(
              <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",border:"1px solid var(--line)",boxShadow:"var(--sh-1)",padding:18}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                  <div>
                    <div style={{fontSize:17.5,fontWeight:700,color:"var(--ink)",marginBottom:selected.role&&selected.role!=="__block__"?5:2}}>{selected.name||(selected.role==="__block__"?"Reserved":selected.role==="__wall__"?"Wall":"Open desk")}</div>
                    {selected.role&&selected.role!=="__block__"&&selected.role!=="__wall__"&&<span style={{fontSize:11,color:rs.text,background:rs.bg,border:`1px solid ${rs.border}`,borderRadius:6,padding:"3px 9px",fontWeight:700}}>{selected.role}</span>}
                    <div style={{fontSize:11,color:"var(--ink-3)",marginTop:6}}>Row <span style={mono}>{selected.row}</span> · Col <span style={mono}>{selected.col}</span></div>
                  </div>
                  <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",fontSize:19,cursor:"pointer",color:"var(--ink-3)"}}>×</button>
                </div>

                {selected.role!=="__block__"&&selected.role!=="__wall__"&&(
                  <Segment options={[["view","View"],["devices","Devices"],["person","Person"]]} value={panel}
                    onChange={(p)=>{setPanel(p);if(p==="devices")setDevicesForm(withStandardSlots((selected.devices||[]).map(d=>({...d}))));if(p==="person")setPersonForm({name:selected.name,role:selected.role});}}/>
                )}

                {(panel==="view"||selected.role==="__block__"||selected.role==="__wall__")&&(
                  <>
                    {selected.role!=="__block__"&&selected.role!=="__wall__"&&(
                      <>
                        <div style={{fontSize:12,fontWeight:600,color:"var(--ink-2)",marginBottom:8}}>Devices ({(selected.devices||[]).length})</div>
                        <DeviceList devices={selected.devices} expanded={expandedDevices} setExpanded={setExpandedDevices} onRemove={removeDeviceInline}/>
                        {selected.notes&&<div style={{background:"#FEFAE8",border:"1px solid #F5E4A6",borderRadius:"var(--r-sm)",padding:"8px 11px",fontSize:12,color:"#7A5A16",marginBottom:10}}>📝 {selected.notes}</div>}
                      </>
                    )}
                    <button onClick={()=>setConfirm({id:selected.id,name:selected.name||"Block"})} style={{...btn("var(--surface)","var(--danger)"),width:"100%",padding:"9px 0",fontSize:12.5,border:"1px solid #F6C9CB",boxShadow:"none",marginTop:4}}>
                      {selected.role==="__block__"?"Remove block":selected.role==="__wall__"?"Remove wall":"Remove / move to WFH"}
                    </button>
                  </>
                )}

                {panel==="devices"&&devicesForm&&selected.role!=="__block__"&&selected.role!=="__wall__"&&(
                  <>
                    {(()=>{const recs=inventory.filter(i=>(i.assigned_to||"").trim().toLowerCase()===(selected.name||"").trim().toLowerCase());
                      return (<div style={{marginBottom:12,padding:"9px 11px",background:"var(--brand-wash)",border:"1px solid #FBD9BC",borderRadius:"var(--r-sm)"}}>
                        <div style={{fontSize:10,fontWeight:800,color:"var(--brand-ink)",letterSpacing:".04em"}}>LINKED TO INVENTORY</div>
                        <div style={{fontSize:11.5,color:"var(--ink-2)",marginTop:4,lineHeight:1.4}}>{recs.length} item{recs.length===1?"":"s"} on record. Saving updates the Inventory tab. Clearing a device returns it to Unassigned instead of deleting it.</div>
                      </div>);})()}
                    <div style={{fontSize:12,fontWeight:600,color:"var(--ink-2)",marginBottom:8}}>Edit devices</div>
                    <DeviceEditList form={devicesForm} setForm={setDevicesForm}/>
                    <div style={{display:"flex",gap:6}}><button onClick={()=>setPanel("view")} style={{...ghost(),flex:1,padding:"9px 0"}}>Cancel</button><button onClick={saveDevices} style={{...btn("var(--ok)","#fff"),flex:1,padding:"9px 0"}}>Save</button></div>
                  </>
                )}

                {panel==="person"&&personForm&&selected.role!=="__block__"&&selected.role!=="__wall__"&&(
                  <>
                    <div style={{fontSize:12,fontWeight:600,color:"var(--ink-2)",marginBottom:8}}>{selected.name?"Edit person":"Assign this desk"}</div>
                    <div style={{marginBottom:11}}><div style={lStyle}>Name</div><input value={personForm.name} onChange={e=>setPersonForm(f=>({...f,name:e.target.value}))} placeholder="Type a name to assign" style={iStyle}/></div>
                    <div style={{marginBottom:11}}><div style={lStyle}>Role</div>
                      <select value={personForm.role} onChange={e=>{if(e.target.value==="__new__")requestNewRole("person");else setPersonForm(f=>({...f,role:e.target.value}));}} style={iStyle}>
                        {roleOptions.map(r=><option key={r} value={r}>{r}</option>)}
                        <option value="">— No role —</option>
                        <option value="__new__">＋ Add new role…</option>
                      </select>
                    </div>
                    <div style={{marginBottom:14}}><div style={lStyle}>Notes</div>
                      <textarea value={selected.notes} onChange={e=>updateNotes(e.target.value)} rows={2} placeholder="Any notes…" style={{...iStyle,resize:"vertical"}}/>
                    </div>
                    <div style={{display:"flex",gap:6}}><button onClick={()=>setPanel("view")} style={{...ghost(),flex:1,padding:"9px 0"}}>Cancel</button><button onClick={savePerson} style={{...btn("var(--ok)","#fff"),flex:1,padding:"9px 0"}}>Save</button></div>
                    {selected.name&&<button onClick={clearSeat} style={{...btn("var(--surface)","var(--danger)"),border:"1px solid #F6C9CB",boxShadow:"none",width:"100%",marginTop:8,padding:"9px 0"}}>Clear seat (keep desk, unassign devices)</button>}
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
